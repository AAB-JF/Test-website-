<!DOCTYPE html>
<html>
<head>
    <title>Test Page</title>
</head>
<body style="text-align: center; padding: 50px; font-family: Arial;">
    <h1>Welcome Visitor! 👋</h1>
    <p>Click the button to test counting:</p>
    
    <h2 id="num" style="color: green; font-size: 40px;">0</h2>
    
    <button onclick="countUp()" style="padding: 10px 20px; font-size: 16px;">Count 1 to 10</button>

    <script>
        let x = 0;
        function countUp() {
            if (x < 10) {
                x++;
                document.getElementById('num').innerText = x;
            } else {
                alert('Test Complete! Interactivity works!');
            }
        }
    </script>
</body>
</html>
