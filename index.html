<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Test Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Test Website 🚀</h1>
    <p>Built and tested directly from my Android phone using Acode.</p>
  </header>

  <section>
    <h2>About Me</h2>
    <p>I'm learning how web development works from the ground up.</p>
  </section>

  <!-- NEW: Interactive Test Section -->
  <section style="background: #eef2f7; padding: 20px; border-radius: 8px; text-align: center;">
    <h2>JavaScript Test Panel</h2>
    <p>Test if your website can handle interactive actions:</p>
    
    <button onclick="runTest()" style="background: #0066cc; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer;">
      Click to Test
    </button>
    
    <p id="output-text" style="margin-top: 15px; font-weight: bold; color: #333;"></p>
  </section>

  <footer>
    <p>Next stop: Publishing live to GitHub Pages!</p>
  </footer>

  <!-- JavaScript makes the button work -->
  <script>
    function runTest() {
      const messages = [
        "🎉 Success! JavaScript is running perfectly!",
        "⚡ Awesome! Your mobile development environment works!",
        "🚀 You just wrote your first dynamic web function!"
      ];
      // Pick a random message each time the button is clicked
      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      document.getElementById("output-text").innerText = randomMsg;
    }
  </script>

</body>
</html>
